name: Keep Render bots awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NeonAi bots on Render
        run: |
          for url in \
            "https://neonai-bot.onrender.com/" \
            "https://neonai-ticket-bot.onrender.com/"; do
            code=$(curl -s -o /tmp/render-health.txt -w "%{http_code}" "$url")
            body=$(head -c 80 /tmp/render-health.txt)
            echo "$url → HTTP $code — $body"
            test "$code" = "200"
          done
