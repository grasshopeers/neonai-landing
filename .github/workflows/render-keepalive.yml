name: Keep Render bots awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping NeonAi cloud service
        run: |
          for url in \
            "https://neonai-bots.onrender.com/" \
            "https://neonai-bot.onrender.com/" \
            "https://neonai-ticket-bot.onrender.com/"; do
            code=$(curl -s -o /tmp/h.txt -w "%{http_code}" --max-time 120 "$url" || echo "000")
            body=$(head -c 60 /tmp/h.txt 2>/dev/null || true)
            echo "$url → HTTP $code — $body"
          done
